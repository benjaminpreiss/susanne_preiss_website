version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    versioning-strategy: increase
    exclude-paths:
      - '**/node_modules/**'
      - .scratch/**
      - .fixture-*/**
      - tests/fixtures/**
      - .agents/**
      - .pi/**
      - dist/**
      - .astro/**
    groups:
      stable-tooling:
        applies-to: version-updates
        dependency-type: development
        patterns: ['prettier', 'ignore', '@types/css-tree']
        update-types: [minor, patch]
      astro-svelte:
        applies-to: version-updates
        patterns:
          ['astro', '@astrojs/*', 'svelte', 'svelte-check', '@sveltejs/*', 'prettier-plugin-astro']
        update-types: [minor, patch]
      astro-svelte-majors:
        applies-to: version-updates
        patterns:
          ['astro', '@astrojs/*', 'svelte', 'svelte-check', '@sveltejs/*', 'prettier-plugin-astro']
        update-types: [major]
      videojs:
        applies-to: version-updates
        patterns: ['@videojs/*']
        update-types: [minor, patch]
      videojs-majors:
        applies-to: version-updates
        patterns: ['@videojs/*']
        update-types: [major]
      fonts:
        applies-to: version-updates
        patterns: ['@fontsource/*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '03:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      actions:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
