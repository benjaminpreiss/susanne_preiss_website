name: Deploy selected artifact to staging

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: 'Immutable artifact ID from a successful master validation run (not a run ID)'
        required: true
        type: string
      approve_staging:
        description: 'Approve creating/updating the public susanne-preiss-staging Worker only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  HUSKY: '0'
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  staging:
    if: >-
      github.repository == 'benjaminpreiss/susanne_preiss_website' &&
      github.ref == 'refs/heads/master' && inputs.approve_staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: staging
    concurrency:
      group: cloudflare-staging
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      DEPLOY_TARGET: staging
      STAGING_APPROVED: ${{ inputs.approve_staging }}
      CLOUDFLARE_WORKER_NAME: susanne-preiss-staging
    steps:
      - name: Staging opt-in
        id: gate
        env:
          ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
        run: |
          if [ "$ENABLED" = true ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Staging deployment is disabled.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 10.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install pinned tooling without rebuilding
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Resolve the explicitly selected validated artifact
        id: artifact
        if: steps.gate.outputs.enabled == 'true'
        env:
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/staging-artifact.ts
      - name: Download selected artifact from its exact source run
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          run-id: ${{ steps.artifact.outputs.source-run-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tested-site
          merge-multiple: true
      - name: Verify artifact and dedicated staging target
        id: prepare
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ORIGIN: ${{ vars.CLOUDFLARE_ORIGIN }}
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.source-run-id }}
          TESTED_COMMIT: ${{ steps.artifact.outputs.tested-commit }}
        run: pnpm exec tsx scripts/deploy-static.ts prepare
      - name: Upload selected artifact to staging
        id: upload
        if: steps.prepare.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3, reviewed distribution
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: pnpm
          quiet: true
          command: >-
            deploy --config "${{ runner.temp }}/wrangler-staging.json"
            --message "${{ steps.prepare.outputs.message }}"
      - name: Verify staging output and deployment identity
        if: steps.upload.outcome == 'success'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ORIGIN: ${{ vars.CLOUDFLARE_ORIGIN }}
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.source-run-id }}
          TESTED_COMMIT: ${{ steps.artifact.outputs.tested-commit }}
        run: pnpm exec tsx scripts/deploy-static.ts verify
      - name: Record failed staging upload
        if: failure() && steps.upload.outcome == 'failure'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ORIGIN: ${{ vars.CLOUDFLARE_ORIGIN }}
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.source-run-id }}
          TESTED_COMMIT: ${{ steps.artifact.outputs.tested-commit }}
        run: pnpm exec tsx scripts/deploy-static.ts upload-failed
