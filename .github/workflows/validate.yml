name: Validate static site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  HUSKY: '0'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    # Cloudflare owns deployment; cancel only superseded GitHub validation.
    concurrency:
      group: validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm artifact:check
      - run: pnpm smoke:static
      - name: Identify tested output
        id: identity
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          echo "name=static-$TESTED_SHA-$RUN_ID-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain tested master output for inspection, not deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.name }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
