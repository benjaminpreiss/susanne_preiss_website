name: Validate static site

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  HUSKY: '0'
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    # Cancel superseded validation, never a future in-flight deployment job.
    concurrency:
      group: validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-name: ${{ steps.identity.outputs.name }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      tested-commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm artifact:check
      - run: pnpm smoke:static
      - name: Identify tested output
        id: identity
        env:
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          echo "commit=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          echo "name=static-$TESTED_SHA-$RUN_ID-$RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Retain tested master output
        id: upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.name }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy-production:
    needs: validate
    if: >-
      github.repository == 'benjaminpreiss/susanne_preiss_website' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      github.actor != 'renovate[bot]' && github.actor != 'renovate' && github.actor != 'renovate-bot'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      # Environment-level vars must be checked after entering the Environment.
      - name: Production opt-in
        id: gate
        env:
          ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
        run: |
          if [ "$ENABLED" = true ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Production deployment is disabled.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: steps.gate.outputs.enabled == 'true'
        with:
          ref: ${{ needs.validate.outputs.tested-commit }}
          persist-credentials: false
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          version: 10.8.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: 24.20.0
          cache: pnpm
      - name: Install pinned deployment tooling, without rebuilding
        if: steps.gate.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Download this run's exact tested artifact
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/tested-site
          merge-multiple: true
      - name: Verify artifact, production target and freshness
        id: prepare
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_ORIGIN: ${{ vars.CLOUDFLARE_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact-digest }}
          TESTED_COMMIT: ${{ needs.validate.outputs.tested-commit }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec tsx scripts/deploy-static.ts prepare
      - name: Upload tested static assets
        id: upload
        if: steps.prepare.outputs.deploy == 'true'
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3, reviewed distribution
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.147.0'
          packageManager: pnpm
          quiet: true
          command: >-
            deploy --config "${{ runner.temp }}/wrangler-production.json"
            --message "${{ steps.prepare.outputs.message }}"
      - name: Verify live output and record deployment identity
        if: steps.upload.outcome == 'success'
        env:
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_ORIGIN: ${{ vars.CLOUDFLARE_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact-digest }}
          TESTED_COMMIT: ${{ needs.validate.outputs.tested-commit }}
        run: pnpm exec tsx scripts/deploy-static.ts verify
      - name: Record failed upload without automatic rollback
        if: failure() && steps.upload.outcome == 'failure'
        env:
          CLOUDFLARE_DEPLOY_ENABLED: ${{ vars.CLOUDFLARE_DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          CLOUDFLARE_ORIGIN: ${{ vars.CLOUDFLARE_ORIGIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.validate.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ needs.validate.outputs.artifact-name }}
          ARTIFACT_DIGEST: ${{ needs.validate.outputs.artifact-digest }}
          TESTED_COMMIT: ${{ needs.validate.outputs.tested-commit }}
        run: pnpm exec tsx scripts/deploy-static.ts upload-failed
